# Temporary branch-only workflow to generate a correct pnpm v10 lockfile.
# Remove after lockfile has been committed and full CI is green.
name: Shader lockfile bootstrap
on:
  push:
    branches: [feat/shader-foundation-webgpu-20261020]
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve workspace lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Commit generated lockfile to feature branch
        run: |
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore: 更新 Shader 依赖锁文件"
            git push origin HEAD:feat/shader-foundation-webgpu-20261020
          fi
