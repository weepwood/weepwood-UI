name: Temporary lockfile bootstrap

on:
  push:
    branches: [feat/storybook-ui-foundation]

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/storybook-ui-foundation
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate lockfile without lifecycle scripts
        run: pnpm install --no-frozen-lockfile --ignore-scripts
      - name: Commit only lockfile if changed
        shell: bash
        run: |
          git add pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore: 固定 pnpm 依赖版本'
            git push origin HEAD:feat/storybook-ui-foundation
          fi
