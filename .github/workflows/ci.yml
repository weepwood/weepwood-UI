name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Vue, tests and Storybook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies (bootstrap)
        run: pnpm install --no-frozen-lockfile
      - name: Validate library and playground types
        run: pnpm typecheck
      - name: Component unit tests
        run: pnpm test
      - name: Build consuming Playground
        run: pnpm build:playground
      - name: Build Storybook
        run: pnpm build:storybook
      - name: Upload Storybook artifact
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: storybook-static/
      - name: Upload generated lockfile for reproducible install follow-up
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-lock-bootstrap
          path: pnpm-lock.yaml
